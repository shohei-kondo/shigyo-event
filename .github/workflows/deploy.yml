name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1つに制限（進行中のデプロイは中断しない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Pages用ターゲットを明示（本番用は npm run build = DEPLOY_TARGET=production）
    env:
      DEPLOY_TARGET: pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # lockfile を含めていないため npm ci ではなく npm install
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # ビルド時の static-lp-snapshot が Chromium を必要とする
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build (Pages target)
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
